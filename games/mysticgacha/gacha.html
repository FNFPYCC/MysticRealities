<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мистик Гача — MysticRealities</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="gacha.css">
</head>
<body>

<header class="header">
    <a href="../../index.html" class="logo">MYSTIC<span>REALITIES</span></a>
    <nav>
        <a href="../../index.html">Главная сайта</a>
        <a href="gacha.html" style="color: var(--bright); font-weight: bold;">Гача</a>
    </nav>
</header>

<main class="gacha-container">
    <div class="top-bar">
        <div class="currency"><span id="moneyCount">0</span> ⬡ <small>полихромы</small></div>
        <div class="currency">Доход: <span id="incomeRate">+0/мин</span> • через <span id="incomeTimer">--</span></div>
        <div class="currency" id="profileBar">👤 <b id="profName">—</b> <span class="cloud" id="cloudState"></span>
            <button class="mini" id="profSwitch">Выйти</button><button class="mini" id="saveExport">Экспорт</button><button class="mini" id="saveImport">Импорт</button></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="roll">Сигналы</button>
        <button class="tab-btn" data-tab="history">История</button>
        <button class="tab-btn" data-tab="inventory">Инвентарь</button>
        <button class="tab-btn" data-tab="characters">Агенты</button>
        <button class="tab-btn" data-tab="squad">Отряд</button>
    </div>

    <!-- СИГНАЛЫ -->
    <div id="tab-roll" class="tab-content">
        <div class="sig-screen">
            <div class="sig-side" id="sigSide"></div>
            <div class="sig-stage" id="sigStage">
                <img class="sig-char" id="sigChar" alt="">
                <div class="cur-chips sig-cur" id="sigCur"></div>
                <div class="sig-info">
                    <h2 id="sigTitle"></h2>
                    <div class="sig-time" id="sigTime"></div>
                    <div class="sig-blurb" id="sigText"></div>
                </div>
                <div class="sig-name" id="sigName"></div>
                <div class="sig-a" id="sigA"></div>
                <div class="sig-pity" id="sigPity"></div>
            </div>
            <div class="sig-bottom">
                <button class="pill" id="sigRegistry">✦ Реестр сигналов</button>
                <button class="pill" id="sigDetails">Подробности</button>
                <span class="grow"></span>
                <div class="pull-btn"><span class="tk" id="tk1"></span><button class="pill gold" id="roll1Btn">1 поиск сигнала</button></div>
                <div class="pull-btn"><span class="tk" id="tk10"></span><button class="pill gold" id="roll10Btn">10 поисков сигнала</button></div>
            </div>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="tab-history" class="tab-content hidden">
        <h2>История сигналов</h2>
        <div id="historyList" class="history-list"></div>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div id="tab-inventory" class="tab-content hidden">
        <h2>W-двигатели</h2>
        <div class="inventory-grid" id="weaponGrid"></div>
        <h2 style="margin-top: 30px;">Диски</h2>
        <div class="inventory-grid" id="diskGrid"></div>
    </div>

    <!-- АГЕНТЫ -->
    <div id="tab-characters" class="tab-content hidden">
        <h2>Все агенты</h2>
        <div class="character-list" id="characterList"></div>
    </div>

    <!-- ОТРЯД -->
    <div id="tab-squad" class="tab-content hidden">
        <h2>Отряд</h2>
        <div class="squad-summary" id="squadSummary"></div>
        <div class="squad-cards" id="squadCards"></div>
    </div>

    <!-- ПРОФИЛЬ АГЕНТА -->
    <div id="charModal" class="char-screen hidden">
        <div class="cs-top">
            <button id="closeModalBtn" class="eq-back">⮌ Назад</button>
            <div class="agent-strip" id="agentStrip"></div>
        </div>
        <div class="cs-body">
            <div class="cs-art">
                <img id="modalCharImg" src="" alt="">
                <button class="cinema" id="cinemaBtn" title="Разум"><b id="cinemaLv">0/6</b><span>РАЗУМ</span></button>
            </div>
            <div class="cs-panel">
                <div class="char-rarity" id="modalCharRarity"></div>
                <h1 id="modalCharName">Имя</h1>
                <div class="chips" id="modalChips"></div>

                <div id="modal-tab-stats">
                    <div class="stat-box" id="statMeta"></div>
                    <div class="stat-box grid" id="statBox"></div>
                    <div id="setBonuses" class="set-bonuses"></div>
                    <button class="hero-button" id="levelUpBtn" style="width: 100%;"></button>
                </div>

                <div id="modal-tab-skills" class="hidden">
                    <div class="core-row" id="coreRow"></div>
                    <button class="mini wide" data-up="core" id="coreUp"></button>
                    <h4 class="sub-h">Навыки</h4>
                    <div class="skill-row" id="skillRow"></div>
                </div>

                <div id="modal-tab-equip" class="hidden">
                    <div class="ring" id="viewRing"></div>
                    <div class="set-bonuses view-notes" id="viewNotes"></div>
                </div>
            </div>
        </div>
        <div class="cs-tabs">
            <button class="modal-tab active" data-mtab="stats">Базовые параметры</button>
            <button class="modal-tab" data-mtab="skills">Навыки</button>
            <button class="modal-tab" data-mtab="equip">Снаряжение</button>
            <button class="modal-tab" data-mtab="mind">Разум</button>
        </div>
    </div>
</main>

<!-- ЭКРАН СНАРЯЖЕНИЯ -->
<div id="equipScreen" class="eq-screen hidden">
    <div class="eq-top">
        <button id="eqBack" class="eq-back">⮌ Назад</button>
        <div class="eq-title" id="eqTitle"></div>
        <div class="eq-money"><span id="eqMoney">0</span> ⬡</div>
    </div>
    <div class="eq-body">
        <div class="eq-list" id="eqList"></div>
        <div class="eq-detail" id="eqDetail"></div>
        <div class="eq-ring-wrap">
            <div class="ring">
                <div class="ring-slot rs1" data-slot="0"></div>
                <div class="ring-slot rs2" data-slot="1"></div>
                <div class="ring-slot rs3" data-slot="2"></div>
                <div class="ring-slot rs4" data-slot="3"></div>
                <div class="ring-slot rs5" data-slot="4"></div>
                <div class="ring-slot rs6" data-slot="5"></div>
                <div class="ring-slot ring-w" data-slot="w"></div>
                <div class="ring-lv" id="ringLv"></div>
            </div>
        </div>
    </div>
    <div class="eq-bottom">
        <button id="eqFilter" class="eq-btn">Фильтр: все</button>
        <span class="grow"></span>
        <button id="eqUnequip" class="eq-btn">Снять</button>
        <button id="eqEquip" class="eq-btn">Заменить</button>
        <button id="eqUpgrade" class="eq-btn">Усилить</button>
    </div>
</div>

<!-- РЕЗУЛЬТАТЫ ПОИСКА -->
<div id="resultScreen" class="res-screen hidden">
    <div class="res-title">Результаты поиска</div>
    <div class="res-grid" id="resGrid"></div>
    <div class="res-confirm"><span><i>◈</i> <b id="resEcho">0</b></span><button id="resOk">Подтвердить</button></div>
    <div class="muted">Нажмите на любое место, чтобы закрыть</div>
</div>

<!-- МАГАЗИН «РЕЕСТР СИГНАЛОВ» -->
<div id="shopScreen" class="shop-screen hidden">
    <div class="shop-top"><button id="shopBack" class="eq-back">⮌ Назад</button><span class="grow"></span><div class="cur-chips" id="shopCur"></div></div>
    <div class="shop-tabs" id="shopTabs"></div>
    <div class="shop-grid" id="shopGrid"></div>
</div>

<!-- ПОДРОБНОСТИ КАНАЛА -->
<div id="detailsScreen" class="pop hidden"><div class="pop-card">
    <div id="detailsBody"></div>
    <button class="hero-button" id="detailsClose" style="width:100%;margin-top:16px">Закрыть</button>
</div></div>

<!-- ВХОД ТОЛЬКО ЧЕРЕЗ GITHUB -->
<div id="loginScreen" class="pop"><div class="pop-card" style="text-align:center">
    <h2>Вход через GitHub</h2>
    <p class="muted" id="loginMsg">Проверяем вход…</p>
    <button class="hero-button" id="ghBtn" style="width:100%;display:none">Войти через GitHub</button>
</div></div>

<!-- ВЫБОР АГЕНТА В СЛОТ ОТРЯДА -->
<div id="pickScreen" class="pick-screen hidden">
    <div class="ms-top">
        <button id="pkCancel" class="eq-back">⮌ Отмена</button>
        <div class="ms-title" id="pkTitle"></div>
        <button class="pill" id="pkAuto">⚡ Быстрый подбор</button>
    </div>
    <div class="pk-body">
        <div class="pk-left">
            <img id="pkArt" alt="">
            <div class="pk-name"><b id="pkName"></b><div class="chips" id="pkChips"></div></div>
            <div class="pk-tabs"><button data-pktab="stats">Базовые параметры</button><button data-pktab="skills">Навыки</button><button data-pktab="equip">Снаряжение</button></div>
        </div>
        <div class="pk-grid" id="pkGrid"></div>
    </div>
    <div class="pk-bottom"><button class="hero-button" id="pkAssign">В отряд</button></div>
</div>

<!-- МЕНТАЛЬНАЯ КАРТИНА (РАЗУМ) -->
<div id="mindScreen" class="mind-screen hidden">
    <div class="ms-top">
        <button id="msBack" class="eq-back">⮌ Назад</button>
        <div class="ms-title">Ментальная картина</div>
        <div class="agent-strip" id="msStrip"></div>
    </div>
    <div class="ms-body">
        <div class="ms-side" id="msSide"></div>
        <div class="ms-stage"><img id="msArt" alt=""><div id="msCards"></div></div>
    </div>
</div>

<!-- ПОДТВЕРЖДЕНИЕ: ПРОБУДИТЬ РАЗУМ -->
<div id="awakenScreen" class="awaken hidden">
    <div class="aw-logo">MIND<small>[ MINDSCAPE CINEMA ]</small></div>
    <h2 id="awTitle"></h2>
    <p class="aw-desc" id="awDesc"></p>
    <div class="aw-item"><img id="awImg" alt=""><span id="awCount">1/1</span></div>
    <div class="aw-btns"><button id="awCancel">✕ Отменить</button><button id="awOk">✓ Пробудить</button></div>
</div>

<script src="gacha-content.js"></script>
<script src="gacha-data.js"></script>
<script src="gacha-auth.js"></script>
<script src="gacha.js"></script>
</body>
</html>
