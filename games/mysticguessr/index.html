
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MysticGuessr | MysticRealities</title>

    <link rel="stylesheet" href="game.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<header class="topbar">
    <a href="../../index.html" class="logo">
        Mystic<span>Realities</span>
    </a>

    <div class="game-name">MYSTICGUESSR</div>

    <div class="round-info" id="roundInfo">
        Раунд 1 / 5
    </div>
</header>

<main class="game-layout">

    <section class="view-section">

        <div id="panorama">
            <div id="loading">Загрузка панорамы...</div>
        </div>

        <div class="view-help">
            Перетаскивай мышью, чтобы осматриваться
        </div>

        <div class="timer" id="timer">
            03:00
        </div>

        <div class="view-controls">
            <button id="startButton">
                Начать раунд
            </button>
        </div>

    </section>

</main>

<!-- ======================================
     МИНИ-КАРТА
====================================== -->

<div class="map-widget" id="mapWidget">

    <div class="map-header">

        <div>
            <h2>Карта мира</h2>
            <span>PIXEL WORLD</span>
        </div>

        <button id="expandMapButton" title="Развернуть карту">
            ⛶
        </button>

    </div>

    <div class="map-canvas-wrapper">
        <canvas id="worldMap" width="512" height="512"></canvas>
    </div>

    <div class="map-help">
        Колёсико — масштаб • ЛКМ — перемещение
    </div>

    <div class="coordinates" id="coordinates">
        Метка не установлена
    </div>

    <div class="map-buttons">

        <button id="resetMapButton">
            Сбросить
        </button>

        <button id="guessButton" disabled>
            Подтвердить место
        </button>

    </div>

    <button id="closeMapButton">
        Закрыть карту
    </button>

    <div id="result"></div>

</div>

<script src="game.js"></script>

</body>
</html>
